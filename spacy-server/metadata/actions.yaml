actions:
  - name: login
    definition:
      kind: synchronous
      handler: '{{NEXT_SERVER_API}}/login'
    permissions:
      - role: user
      - role: anonymous
  - name: me
    definition:
      kind: ""
      handler: '{{NEXT_SERVER_API}}/me'
      forward_client_headers: true
    permissions:
      - role: user
  - name: signUp
    definition:
      kind: synchronous
      handler: '{{NEXT_SERVER_API}}/sign_up'
    permissions:
      - role: user
      - role: anonymous
custom_types:
  enums: []
  input_objects:
    - name: SignUpInput
    - name: LoginInput
  objects:
    - name: SignUpResponse
    - name: LoginResponse
    - name: User
  scalars: []
